<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Soundwave Bars & Musical Glyph -->
  <g filter="url(#glow)">
    <!-- Central Modern Play / Audio Beam -->
    <path d="M 210 160 C 210 148 224 140 234 146 L 350 216 C 360 222 360 238 350 244 L 234 314 C 224 320 210 312 210 300 Z" fill="url(#accentGrad)"/>

    <!-- Equalizer / Sonic Waves -->
    <!-- Bar 1 -->
    <rect x="120" y="220" width="18" height="72" rx="9" fill="url(#accentGrad)" opacity="0.7"/>
    <!-- Bar 2 -->
    <rect x="150" y="180" width="18" height="152" rx="9" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Bar 3 -->
    <rect x="180" y="235" width="18" height="42" rx="9" fill="url(#accentGrad)" opacity="0.8"/>
    
    <!-- Outer Sonic Rings -->
    <path d="M 370 190 A 90 90 0 0 1 370 270" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 405 160 A 135 135 0 0 1 405 300" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 440 135 A 175 175 0 0 1 440 325" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.35"/>
  </g>

  <!-- Tag Pill: MP3 -->
  <g transform="translate(196, 375)">
    <rect x="0" y="0" width="120" height="38" rx="19" fill="#1e2333" stroke="url(#accentGrad)" stroke-width="2"/>
    <text x="60" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">MP3</text>
  </g>
</svg>
